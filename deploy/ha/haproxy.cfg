# Floating Postgres address for deploy/ha: forwards only to the node Patroni reports as leader
# (GET /primary returns 200 on the leader alone). Existing sessions to a demoted node are cut.
global
  maxconn 500
defaults
  mode tcp
  timeout connect 2s
  timeout client 30m
  timeout server 30m
  timeout check 2s
frontend pg_rw
  bind *:5432
  default_backend pg_primary
backend pg_primary
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
  server pg-lagos 172.31.240.10:5432 check port 8008
  server pg-abuja 172.31.240.11:5432 check port 8008
