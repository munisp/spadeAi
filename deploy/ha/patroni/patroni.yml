# Patroni node config for deploy/ha. Per-node values (name, addresses, passwords) come from PATRONI_* env.
scope: spade
restapi:
  listen: 0.0.0.0:8008
etcd3:
  hosts: [172.31.240.40:2379, 172.31.240.41:2379, 172.31.240.42:2379]
bootstrap:
  dcs:
    ttl: 20
    loop_wait: 5
    retry_timeout: 5
    # Only a synchronous standby (one that holds every acknowledged commit) may be promoted.
    synchronous_mode: true
    maximum_lag_on_failover: 0
    postgresql:
      use_pg_rewind: true
      remove_data_directory_on_rewind_failure: true
      remove_data_directory_on_diverged_timelines: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 256MB
        wal_log_hints: "on"
        password_encryption: scram-sha-256
  initdb: [{encoding: UTF8}, data-checksums]
  post_bootstrap: /etc/patroni-post-bootstrap.sh
postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /tmp/pgpass
  # Clone without waiting for the next scheduled checkpoint.
  basebackup: [{checkpoint: fast}]
  authentication:
    superuser: {username: spade}
    replication: {username: replicator}
  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256
tags:
  nofailover: false
  noloadbalance: false
