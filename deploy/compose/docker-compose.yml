# Local SpadeAi stack. Postgres is the system of record; TigerBeetle is the financial ledger.
name: spadeai
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spade
      POSTGRES_PASSWORD: spade-local-dev
      POSTGRES_DB: spadeai
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spade -d spadeai"]
      interval: 3s
      retries: 30

  tigerbeetle-format:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    entrypoint: ["/bin/sh", "-c", "test -f /data/0_0.tigerbeetle || /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle"]
    volumes: [tbdata:/data]
    security_opt: ["seccomp=unconfined"]

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    command: ["start", "--addresses=0.0.0.0:3000", "--development", "/data/0_0.tigerbeetle"]
    ports: ["3001:3000"]
    volumes: [tbdata:/data]
    security_opt: ["seccomp=unconfined"]
    depends_on:
      tigerbeetle-format: {condition: service_completed_successfully}

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: spade
      POSTGRES_PWD: spade-local-dev
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports: ["7233:7233"]
    depends_on:
      postgres: {condition: service_healthy}

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: spade
      KC_DB_PASSWORD: spade-local-dev
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-dev
      KC_HTTP_PORT: "8080"
    ports: ["8180:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    depends_on:
      postgres: {condition: service_healthy}

  permify:
    image: ghcr.io/permify/permify:latest
    command: ["serve", "--database-engine=postgres", "--database-uri=postgres://spade:spade-local-dev@postgres:5432/permify?sslmode=disable", "--database-auto-migrate=true"]
    ports: ["3476:3476", "3478:3478"]
    depends_on:
      postgres: {condition: service_healthy}

  backups:
    # restic REST server: off-host backup target. Repositories are encrypted client-side with a
    # per-service password, so this server never sees plaintext. HTTP basic auth is on: with no user
    # every request gets 401. Create the user with scripts/backup-repo-user.sh.
    image: restic/rest-server:0.13.0
    ports: ["8000:8000"]
    volumes: ["backupdata:/data"]

volumes:
  pgdata: {}
  tbdata: {}
  backupdata: {}
