apiVersion: v1
kind: ServiceAccount
metadata:
  name: spade-agent
  namespace: {{ .Release.Namespace }}
---
# Cluster-scoped because each SpadeAi service gets its own namespace. The agent itself refuses to touch
# namespaces not labelled spade.ai/service=<id>, and only applies Namespace, Secret, PVC, Deployment,
# Service, Ingress and NetworkPolicy objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spade-agent
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets, services, persistentvolumeclaims]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [clusterissuers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spade-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spade-agent
subjects:
  - kind: ServiceAccount
    name: spade-agent
    namespace: {{ .Release.Namespace }}
